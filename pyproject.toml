[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qqagent"
version = "0.1.0"
description = "A minimal, extension-first QQ group agent for OneBot v11"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kayoko contributors" }]
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "websockets>=13.0",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "openai>=1.50",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "aiohttp>=3.10",
]

[project.scripts]
qqagent = "qqagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
]
